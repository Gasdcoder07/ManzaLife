<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Logotipo Pacífico</title>
  <desc id="desc">Globo terráqueo azul con una bolsa de compras al frente</desc>

  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#8ac9d8"/>
      <stop offset="1" stop-color="#67b4c8"/>
    </linearGradient>
    <clipPath id="globe-clip">
      <circle cx="256" cy="256" r="205"/>
    </clipPath>
  </defs>

  <!-- El SVG no tiene rectángulo de fondo: todo el exterior es transparente. -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#3a91ad" stroke-width="9"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#a2d4e0" stroke-width="6"/>

  <g clip-path="url(#globe-clip)">
    <!-- Retícula del globo -->
    <g fill="none" stroke="#9fd1dc" stroke-width="7" stroke-linecap="round">
      <path d="M106 123c43 30 94 45 150 45s107-15 150-45"/>
      <path d="M145 73c42 54 62 116 60 187"/>
      <path d="M367 73c-42 54-62 116-60 187"/>
    </g>

    <!-- Continentes simplificados -->
    <g fill="#9fd1dc">
      <path d="M68 207c10-35 32-65 63-84l22 1 11-9 19 5 10 13 20 3 10 13 26 8 9 18-12 16-22 1-8 14-19 5-11 19-14 3-6 23-17 8-10-13-13 2-5 17-11 1-4-15-17-7-6-16-18-5-7-21-13-8z"/>
      <path d="M265 218l25-14 22 8 12 18 27 9 12 24 24 10 8 21-12 19-17 2-7 26-17 19-5 28-22 34-17 4-9-17 5-25-12-21 4-29-15-15 7-21-13-14-2-21-14-10z"/>
      <path d="M354 119l20-10 18 5 4 14 15 10-4 15-16 4-9 13-18-5-5-17-13-9z"/>
    </g>

    <!-- Olas del océano -->
    <path fill="#a8d7e2" d="M23 372c54-42 111-55 165-31 32 14 56 42 93 53 59 18 119-5 208-74v192H23z"/>
    <path fill="#a8d7e2" d="M-1 444c67-40 125-41 176-12 40 23 72 48 122 48 66 0 124-39 216-112v144H-1z"/>
    <g fill="none" stroke="#3a91ad" stroke-width="7" stroke-linecap="round">
      <path d="M30 370c59-39 109-45 160-20 38 19 70 44 115 48 55 4 104-22 177-78"/>
      <path d="M14 431c66-41 120-43 170-15 39 22 72 45 119 45 60 0 111-31 190-94"/>
    </g>
  </g>

  <!-- Bolsa de compras -->
  <path d="M177 174h158c9 0 15 6 17 17l24 176c3 17-6 27-23 27H159c-17 0-26-10-23-27l24-176c2-11 8-17 17-17z" fill="url(#bag)" stroke="#287b99" stroke-width="10" stroke-linejoin="round"/>
  <path d="M208 200v-46c0-39 19-61 48-61s48 22 48 61v46" fill="none" stroke="#176b88" stroke-width="8" stroke-linecap="round"/>
  <circle cx="208" cy="200" r="11" fill="#287b99"/>
  <circle cx="304" cy="200" r="11" fill="#287b99"/>
</svg>
